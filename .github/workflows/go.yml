
name: Go
on: 
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build:
        runs-on: ubuntu-latest
        container:
            image: alpine:3.19
        steps:
            - uses: actions/checkout@v4
            - name: Set up Go 1.21.6
              uses: actions/setup-go@v4
              with:
                  go-version: 1.21.6
            - name: Install dependencies
              run: |
                    go get 
            - name: Build
              run: |
                    go build -v -o ./bin/
            - name: Upload Binary as release artifact
              uses: actions/upload-artifact@v4
              with:
                    name: bin
                    path: bin